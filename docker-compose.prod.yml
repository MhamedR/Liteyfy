version: '3.8'

services:
  # Production Angular app with Nginx
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: liteyfy-prod
    ports:
      - "80:80"
    environment:
      - NODE_ENV=production
    networks:
      - liteyfy-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:80/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

