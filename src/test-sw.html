<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enable Notifications - Liteyfy</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {
            background: white;
            border-radius: 20px;
            padding: 40px;
            max-width: 500px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        h1 {
            color: #667eea;
            margin-bottom: 10px;
            font-size: 28px;
        }
        p {
            color: #666;
            margin-bottom: 30px;
            line-height: 1.6;
        }
        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 50px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            transition: transform 0.2s, box-shadow 0.2s;
            margin: 10px 0;
        }
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }
        button:active {
            transform: translateY(0);
        }
        button:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }
        .status {
            padding: 15px;
            border-radius: 10px;
            margin: 20px 0;
            display: none;
        }
        .status.show {
            display: block;
        }
        .success {
            background: #d4edda;
            color: #155724;
            border-left: 4px solid #28a745;
        }
        .error {
            background: #f8d7da;
            color: #721c24;
            border-left: 4px solid #dc3545;
        }
        .info {
            background: #d1ecf1;
            color: #0c5460;
            border-left: 4px solid #17a2b8;
        }
        .emoji {
            font-size: 48px;
            text-align: center;
            margin-bottom: 20px;
        }
        .step {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 10px;
            margin: 10px 0;
            border-left: 4px solid #667eea;
        }
        .step-title {
            font-weight: 600;
            color: #667eea;
            margin-bottom: 5px;
        }
        .back-link {
            text-align: center;
            margin-top: 20px;
        }
        .back-link a {
            color: #667eea;
            text-decoration: none;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="emoji">🔔</div>
        <h1>Enable Push Notifications</h1>
        <p>Get real-time alerts for train delays and weather in Belgium</p>

        <div id="status"></div>

        <button id="enableBtn" onclick="enableNotifications()">
            🚀 Enable Notifications
        </button>

        <div class="back-link">
            <a href="/dashboard">← Back to Dashboard</a>
        </div>
    </div>

    <script>
        const VAPID_KEY = 'BEl62iUYgUivxIkv69yViEuiBIa-Ib27SDbQjfTbkADt98CPWV3_oHlv8IMh-w4QyHqm9-CYdqMQkQ9BvQw5PiI';
        const API_URL = 'http://localhost:3001/api';

        function showStatus(message, type) {
            const status = document.getElementById('status');
            status.className = `status ${type} show`;
            status.innerHTML = message;
        }

        function urlBase64ToUint8Array(base64String) {
            const padding = '='.repeat((4 - base64String.length % 4) % 4);
            const base64 = (base64String + padding).replace(/\-/g, '+').replace(/_/g, '/');
            const rawData = window.atob(base64);
            const outputArray = new Uint8Array(rawData.length);
            for (let i = 0; i < rawData.length; ++i) {
                outputArray[i] = rawData.charCodeAt(i);
            }
            return outputArray;
        }

        async function enableNotifications() {
            const btn = document.getElementById('enableBtn');
            btn.disabled = true;
            btn.textContent = '⏳ Enabling...';

            try {
                // Check support
                if (!('serviceWorker' in navigator)) {
                    throw new Error('Service Workers not supported in your browser');
                }
                if (!('PushManager' in window)) {
                    throw new Error('Push notifications not supported in your browser');
                }
                if (!('Notification' in window)) {
                    throw new Error('Notifications not supported in your browser');
                }

                showStatus('📝 Checking browser support...', 'info');

                // Request permission
                const permission = await Notification.requestPermission();
                if (permission !== 'granted') {
                    throw new Error('Notification permission denied');
                }

                showStatus('✓ Permission granted! Registering service worker...', 'info');

                // Register service worker
                const registration = await navigator.serviceWorker.register('/ngsw-worker.js');
                await navigator.serviceWorker.ready;

                showStatus('✓ Service Worker registered! Subscribing to push...', 'info');

                // Subscribe to push
                const subscription = await registration.pushManager.subscribe({
                    userVisibleOnly: true,
                    applicationServerKey: urlBase64ToUint8Array(VAPID_KEY)
                });

                showStatus('✓ Push subscription successful! Saving to backend...', 'info');

                // Save to backend
                const subscriptionJson = subscription.toJSON();
                const response = await fetch(`${API_URL}/subscriptions`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        endpoint: subscription.endpoint,
                        p256dh: subscriptionJson.keys.p256dh,
                        auth: subscriptionJson.keys.auth,
                        trainLines: [],
                        weatherRegions: [],
                        stibLines: []
                    })
                });

                if (!response.ok) {
                    throw new Error(`Backend error: ${response.status}`);
                }

                const data = await response.json();

                showStatus(`
                    <div class="step">
                        <div class="step-title">✅ Success! Notifications Enabled</div>
                        You will now receive real-time alerts for:
                        <ul style="margin: 10px 0 0 20px;">
                            <li>Train delays & cancellations 🚆</li>
                            <li>Weather alerts ⛈️</li>
                            <li>STIB disruptions 🚇</li>
                        </ul>
                    </div>
                    <div class="step">
                        <div class="step-title">Next Steps:</div>
                        <p style="margin-top: 5px;">Go to <strong>Subscriptions</strong> to select which train lines and weather regions you want to monitor.</p>
                    </div>
                `, 'success');

                btn.textContent = '✅ Enabled!';

                setTimeout(() => {
                    window.location.href = '/subscriptions';
                }, 3000);

            } catch (error) {
                console.error('Error:', error);
                let errorMsg = '❌ Failed to enable notifications<br><br>';

                if (error.message.includes('denied')) {
                    errorMsg += '<strong>Permission was denied.</strong><br>Please click the 🔒 icon in your address bar and allow notifications.';
                } else if (error.message.includes('not supported')) {
                    errorMsg += `<strong>${error.message}</strong><br>Please use a modern browser like Chrome, Firefox, or Edge.`;
                } else {
                    errorMsg += `<strong>Error:</strong> ${error.message}`;
                }

                showStatus(errorMsg, 'error');
                btn.textContent = '🔔 Try Again';
                btn.disabled = false;
            }
        }

        // Check current status on load
        window.onload = async () => {
            if ('Notification' in window) {
                if (Notification.permission === 'granted') {
                    // Check if already subscribed
                    if ('serviceWorker' in navigator) {
                        const registration = await navigator.serviceWorker.getRegistration();
                        if (registration) {
                            const subscription = await registration.pushManager.getSubscription();
                            if (subscription) {
                                showStatus(`
                                    <div class="step">
                                        <div class="step-title">ℹ️ Browser Subscription Found</div>
                                        Your browser already has a push subscription. Click below to re-enable and sync with backend.
                                    </div>
                                `, 'info');
                                document.getElementById('enableBtn').textContent = '🔄 Re-Enable & Sync';
                            }
                        }
                    }
                } else if (Notification.permission === 'denied') {
                    showStatus('❌ Notifications are blocked. Please enable them in your browser settings.', 'error');
                    document.getElementById('enableBtn').disabled = true;
                }
            }
        };
    </script>
</body>
</html>
