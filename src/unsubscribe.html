<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unsubscribe - Liteyfy</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {
            background: white;
            border-radius: 20px;
            padding: 40px;
            max-width: 500px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        h1 {
            color: #f5576c;
            margin-bottom: 10px;
            font-size: 28px;
        }
        p {
            color: #666;
            margin-bottom: 30px;
            line-height: 1.6;
        }
        button {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 50px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            transition: transform 0.2s, box-shadow 0.2s;
            margin: 10px 0;
        }
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(245, 87, 108, 0.3);
        }
        button:active {
            transform: translateY(0);
        }
        .status {
            padding: 15px;
            border-radius: 10px;
            margin: 20px 0;
        }
        .success {
            background: #d4edda;
            color: #155724;
            border-left: 4px solid #28a745;
        }
        .error {
            background: #f8d7da;
            color: #721c24;
            border-left: 4px solid #dc3545;
        }
        .info {
            background: #d1ecf1;
            color: #0c5460;
            border-left: 4px solid #17a2b8;
        }
        .emoji {
            font-size: 48px;
            text-align: center;
            margin-bottom: 20px;
        }
        pre {
            background: #f8f9fa;
            padding: 10px;
            border-radius: 5px;
            overflow-x: auto;
            font-size: 12px;
            margin: 10px 0;
        }
        .back-link {
            text-align: center;
            margin-top: 20px;
        }
        .back-link a {
            color: #f5576c;
            text-decoration: none;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="emoji">🔕</div>
        <h1>Unsubscribe from Notifications</h1>
        <p>This will remove all push notification subscriptions</p>

        <div id="status"></div>

        <button onclick="checkStatus()">
            🔍 Check Current Status
        </button>

        <button onclick="unsubscribe()">
            🗑️ Unsubscribe & Clear All
        </button>

        <div class="back-link">
            <a href="/dashboard">← Back to Dashboard</a>
        </div>
    </div>

    <script>
        function showStatus(message, type) {
            const status = document.getElementById('status');
            status.className = `status ${type}`;
            status.innerHTML = message;
        }

        async function checkStatus() {
            try {
                let info = '<strong>Current Status:</strong><br><br>';

                // Check Service Worker
                if ('serviceWorker' in navigator) {
                    const registration = await navigator.serviceWorker.getRegistration();
                    if (registration) {
                        info += '✅ Service Worker: Registered<br>';

                        // Check push subscription
                        const subscription = await registration.pushManager.getSubscription();
                        if (subscription) {
                            info += '✅ Push Subscription: Active<br>';
                            const sub = subscription.toJSON();
                            info += `<pre>${JSON.stringify(sub, null, 2)}</pre>`;
                        } else {
                            info += '❌ Push Subscription: None<br>';
                        }
                    } else {
                        info += '❌ Service Worker: Not registered<br>';
                    }
                } else {
                    info += '❌ Service Workers not supported<br>';
                }

                // Check notification permission
                if ('Notification' in window) {
                    info += `<br><strong>Permission:</strong> ${Notification.permission}`;
                }

                showStatus(info, 'info');
            } catch (error) {
                showStatus(`❌ Error: ${error.message}`, 'error');
            }
        }

        async function unsubscribe() {
            try {
                let steps = '';

                // 1. Unsubscribe from push
                if ('serviceWorker' in navigator) {
                    const registration = await navigator.serviceWorker.getRegistration();
                    if (registration) {
                        const subscription = await registration.pushManager.getSubscription();
                        if (subscription) {
                            await subscription.unsubscribe();
                            steps += '✅ Unsubscribed from push notifications<br>';
                        } else {
                            steps += 'ℹ️ No active push subscription found<br>';
                        }

                        // 2. Unregister service worker
                        await registration.unregister();
                        steps += '✅ Unregistered service worker<br>';
                    } else {
                        steps += 'ℹ️ No service worker registered<br>';
                    }
                }

                // 3. Clear cache
                if ('caches' in window) {
                    const cacheNames = await caches.keys();
                    for (const name of cacheNames) {
                        await caches.delete(name);
                    }
                    steps += `✅ Cleared ${cacheNames.length} cache(s)<br>`;
                }

                // 4. Clear local storage (optional)
                localStorage.clear();
                steps += '✅ Cleared local storage<br>';

                steps += '<br><strong>✅ All cleaned up!</strong><br>Refresh the page to start fresh.';
                showStatus(steps, 'success');

                // Auto-refresh after 3 seconds
                setTimeout(() => {
                    window.location.reload();
                }, 3000);

            } catch (error) {
                showStatus(`❌ Error: ${error.message}`, 'error');
            }
        }

        // Auto-check on load
        window.onload = checkStatus;
    </script>
</body>
</html>
