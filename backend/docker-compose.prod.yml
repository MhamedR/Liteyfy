version: '3.8'

services:
  # Infrastructure Services
  mongodb:
    image: mongo:7
    container_name: liteyfy-mongodb-prod
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
      - mongodb_config:/data/configdb
      - ./deployment/monitoring/mongodb-exporter.yml:/etc/mongodb-exporter.yml:ro
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:-liteyfy}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-liteyfy_secret}
      MONGO_INITDB_DATABASE: liteyfy
    command: mongod --auth --bind_ip_all
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - liteyfy-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  redis:
    image: redis:7-alpine
    container_name: liteyfy-redis-prod
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
      - ./deployment/monitoring/redis.conf:/usr/local/etc/redis/redis.conf:ro
    command: redis-server /usr/local/etc/redis/redis.conf --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - liteyfy-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: liteyfy-zookeeper-prod
    restart: always
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
      ZOOKEEPER_SERVER_ID: 1
    volumes:
      - zookeeper_data:/var/lib/zookeeper/data
      - zookeeper_logs:/var/lib/zookeeper/log
    healthcheck:
      test: nc -z localhost 2181 || exit 1
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - liteyfy-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: liteyfy-kafka-prod
    restart: always
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
      - "9093:9093"
    volumes:
      - kafka_data:/var/lib/kafka/data
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_JMX_PORT: 9101
      KAFKA_JMX_HOSTNAME: kafka
    healthcheck:
      test: kafka-broker-api-versions --bootstrap-server localhost:9092 || exit 1
      interval: 30s
      timeout: 10s
      retries: 10
    networks:
      - liteyfy-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Microservices with Auto-Scaling Support
  user-subscription-service:
    image: liteyfy/user-subscription-service:${VERSION:-latest}
    build:
      context: ./services/user-subscription-service
      dockerfile: Dockerfile
      args:
        NODE_ENV: production
    restart: always
    deploy:
      replicas: 2
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.5'
          memory: 256M
    ports:
      - "3001-3002:3001"
    environment:
      PORT: 3001
      NODE_ENV: production
      SERVICE_NAME: user-subscription-service
      MONGODB_URI: mongodb://${MONGO_ROOT_USERNAME:-liteyfy}:${MONGO_ROOT_PASSWORD:-liteyfy_secret}@mongodb:27017/liteyfy?authSource=admin
      REDIS_URL: redis://redis:6379
      KAFKA_BROKERS: kafka:9092
      LOG_LEVEL: info
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY}
    depends_on:
      - mongodb
      - redis
      - kafka
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - liteyfy-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  event-ingestion-service:
    image: liteyfy/event-ingestion-service:${VERSION:-latest}
    build:
      context: ./services/event-ingestion-service
      dockerfile: Dockerfile
      args:
        NODE_ENV: production
    restart: always
    deploy:
      resources:
        limits:
          cpus: '0.75'
          memory: 384M
        reservations:
          cpus: '0.5'
          memory: 256M
    ports:
      - "3002:3002"
    environment:
      PORT: 3002
      NODE_ENV: production
      SERVICE_NAME: event-ingestion-service
      MONGODB_URI: mongodb://${MONGO_ROOT_USERNAME:-liteyfy}:${MONGO_ROOT_PASSWORD:-liteyfy_secret}@mongodb:27017/liteyfy?authSource=admin
      KAFKA_BROKERS: kafka:9092
      LOG_LEVEL: info
    depends_on:
      - mongodb
      - kafka
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3002/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - liteyfy-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  notification-delivery-service:
    image: liteyfy/notification-delivery-service:${VERSION:-latest}
    build:
      context: ./services/notification-delivery-service
      dockerfile: Dockerfile
      args:
        NODE_ENV: production
    restart: always
    deploy:
      replicas: 3
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.5'
          memory: 256M
    ports:
      - "3003-3005:3003"
    environment:
      PORT: 3003
      NODE_ENV: production
      SERVICE_NAME: notification-delivery-service
      MONGODB_URI: mongodb://${MONGO_ROOT_USERNAME:-liteyfy}:${MONGO_ROOT_PASSWORD:-liteyfy_secret}@mongodb:27017/liteyfy?authSource=admin
      KAFKA_BROKERS: kafka:9092
      LOG_LEVEL: info
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:admin@liteyfy.be}
    depends_on:
      - mongodb
      - kafka
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3003/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - liteyfy-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  analytics-service:
    image: liteyfy/analytics-service:${VERSION:-latest}
    build:
      context: ./services/analytics-service
      dockerfile: Dockerfile
      args:
        NODE_ENV: production
    restart: always
    deploy:
      resources:
        limits:
          cpus: '0.75'
          memory: 384M
        reservations:
          cpus: '0.5'
          memory: 256M
    ports:
      - "3004:3004"
    environment:
      PORT: 3004
      NODE_ENV: production
      SERVICE_NAME: analytics-service
      MONGODB_URI: mongodb://${MONGO_ROOT_USERNAME:-liteyfy}:${MONGO_ROOT_PASSWORD:-liteyfy_secret}@mongodb:27017/liteyfy?authSource=admin
      REDIS_URL: redis://redis:6379
      LOG_LEVEL: info
    depends_on:
      - mongodb
      - redis
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3004/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - liteyfy-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Monitoring Stack
  prometheus:
    image: prom/prometheus:latest
    container_name: liteyfy-prometheus
    restart: always
    ports:
      - "9090:9090"
    volumes:
      - ./deployment/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deployment/monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    networks:
      - liteyfy-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  grafana:
    image: grafana/grafana:latest
    container_name: liteyfy-grafana
    restart: always
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./deployment/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deployment/monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_INSTALL_PLUGINS: grafana-piechart-panel
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL:-http://localhost:3000}
      GF_USERS_ALLOW_SIGN_UP: false
    depends_on:
      - prometheus
    networks:
      - liteyfy-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Exporters for Metrics
  node-exporter:
    image: prom/node-exporter:latest
    container_name: liteyfy-node-exporter
    restart: always
    ports:
      - "9100:9100"
    command:
      - '--path.procfs=/host/proc'
      - '--path.rootfs=/rootfs'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    networks:
      - liteyfy-network

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: liteyfy-cadvisor
    restart: always
    ports:
      - "8080:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    networks:
      - liteyfy-network

networks:
  liteyfy-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.25.0.0/16

volumes:
  mongodb_data:
  mongodb_config:
  redis_data:
  zookeeper_data:
  zookeeper_logs:
  kafka_data:
  prometheus_data:
  grafana_data:

