version: '3.8'

services:
  # Development Angular app with hot reload
  frontend-dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: liteyfy-dev
    ports:
      - "4200:4200"
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.angular
    environment:
      - NODE_ENV=development
      - CHOKIDAR_USEPOLLING=true
    networks:
      - liteyfy-network
    command: npm start -- --host 0.0.0.0 --poll 2000

  # Optional: Backend API service (to be implemented in Step 2)
  # backend:
  #   image: liteyfy-backend:latest
