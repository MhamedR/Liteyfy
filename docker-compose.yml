  #     - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/liteyfy
  #     - REDIS_URL=redis://redis:6379
  #   networks:
  #     - liteyfy-network
  #   depends_on:
  #     - postgres
  #     - redis

  # Optional: PostgreSQL database (for Step 2)
  # postgres:
  #   image: postgres:15-alpine
  #   container_name: liteyfy-postgres
  #   ports:
  #     - "5432:5432"
  #   environment:
  #     - POSTGRES_DB=liteyfy
  #     - POSTGRES_USER=postgres
  #     - POSTGRES_PASSWORD=postgres
  #   volumes:
  #     - postgres-data:/var/lib/postgresql/data
  #   networks:
  #     - liteyfy-network

  # Optional: Redis cache (for Step 2)
  # redis:
  #   image: redis:7-alpine
  #   container_name: liteyfy-redis
  #   ports:
  #     - "6379:6379"
  #   volumes:
  #     - redis-data:/data
  #   networks:
  #     - liteyfy-network

networks:
  liteyfy-network:
    driver: bridge

